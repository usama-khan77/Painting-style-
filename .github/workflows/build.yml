name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Get AI models and style picture
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/style_predict.tflite https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_predict_quantized_256.tflite
          curl -fL -o app/src/main/assets/style_transfer.tflite https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_transfer_quantized_dynamic.tflite
          cp IMG_20261112_112147.jpg app/src/main/assets/style.jpg
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-photo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
